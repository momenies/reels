name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The renderer is the thing under test; libass is what burns the
      # captions in, so a build without it would pass by drawing nothing.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -filters | grep -q ' ass ' \
            || { echo "ffmpeg has no ass filter (built without libass)"; exit 1; }

      - name: Compile
        run: python -m compileall -q pipeline smoke.py scripts

      # No pip install: smoke.py deliberately runs on the standard library
      # alone, so a broken dependency can never mask a renderer regression.
      - name: Smoke test
        run: python smoke.py
